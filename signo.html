<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>O dia em que nasci</title>
    <link rel="stylesheet" href="signoo.css">
</head>
<body>

    <div class="tela">
        <div class="cartao">
            <h1>O dia em que nasci</h1>

            <div class="linha">
                <label>Informe o dia em que nasceu:</label>
                <input type="text" id="txtdia">
            </div>

            <div class="linha">
                <label>Informe o mês em que nasceu:</label>
                <input type="text" id="txtmes">
            </div>

            <div class="linha">
                <label>Informe o ano em que nasceu:</label>
                <input type="text" id="txtano">
            </div>

            <div class="linha resultado">
                <label>Seu mês de nascimento é:</label>
                <input type="text" id="txtmesnome" readonly>
            </div>

            <div class="linha resultado">
                <label>O dia da semana foi:</label>
                <input type="text" id="txtdiasemana" readonly>
            </div>

            <div class="linha resultado signo-linha">
                <label>Sob o signo de:</label>
                <img src="Captura de tela 2026-09-23 132001.png" name="signo" width="130" height="150">
            </div>

            <div class="linha resultado">
                <label>E a sua idade é:</label>
                <input type="text" id="txtidade" readonly>
            </div>

            <div class="botoes">
                <button class="btn-exibir" onclick="Exibir()">Exibir</button>
                <button class="btn-limpar" onclick="location.reload()">Limpar</button>
            </div>
        </div>
    </div>

    <script src="siggno.js"></script>
</body>
</html>
